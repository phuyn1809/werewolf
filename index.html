<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma sói by Rey<title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
        }
        .font-heading {
            font-family: 'Montserrat', sans-serif;
        }
        .card-flip {
            perspective: 1000px;
        }
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="werewolfApp()" x-init="initApp()" class="min-h-screen flex flex-col justify-between selection:bg-red-900 selection:text-white">

    <!-- Header Navigation -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-red-900/40 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🐺</span>
                <h1 class="text-xl font-heading font-black tracking-wider text-red-500 uppercase">MA SÓI</h1>
            </div>
            
            <nav class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button @click="currentTab = 'player'" 
                        :class="currentTab === 'player' ? 'bg-red-900/80 text-white font-bold shadow' : 'text-slate-400 hover:text-white'"
                        class="px-3 py-1.5 rounded-lg text-xs md:text-sm transition flex items-center space-x-1">
                    <span>🎴 Bóc Bài</span>
                </button>
                <button @click="currentTab = 'wiki'" 
                        :class="currentTab === 'wiki' ? 'bg-red-900/80 text-white font-bold shadow' : 'text-slate-400 hover:text-white'"
                        class="px-3 py-1.5 rounded-lg text-xs md:text-sm transition flex items-center space-x-1">
                    <span>📖 Tra Char</span>
                </button>
                <button @click="openGmTab()" 
                        :class="currentTab === 'gm' || currentTab === 'setup' ? 'bg-amber-600 text-white font-bold shadow' : 'text-amber-500/80 hover:text-amber-400'"
                        class="px-3 py-1.5 rounded-lg text-xs md:text-sm transition flex items-center space-x-1">
                    <span>👑 Quản Trò</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto w-full p-4 flex-grow">

        <!-- TAB 1: PLAYER DRAW CARD -->
        <div x-show="currentTab === 'player'" x-cloak class="space-y-6">
            <div class="text-center space-y-2 py-4">
                <h2 class="text-2xl font-heading font-extrabold text-white">XÁC NHẬN BÓC BÀI</h2>
                <p class="text-xs text-slate-400 max-w-md mx-auto">Chọn đúng tên của bạn trong Group Chat Instagram để mở thẻ bí mật</p>
            </div>

            <div x-show="!gameState.players.length" class="bg-slate-900/80 border border-amber-500/30 rounded-2xl p-6 text-center space-y-3 max-w-md mx-auto">
                <p class="text-amber-400 font-medium text-sm">⚠️ Chưa có ván đấu nào! Nhờ Quản Trò tạo ván và gửi lại link nhé.</p>
            </div>

            <div x-show="gameState.players.length" class="max-w-md mx-auto space-y-4">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Tên người chơi của bạn:</label>
                        <select x-model="selectedPlayerId" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-medium focus:outline-none focus:border-red-500">
                            <option value="">-- Chọn tên bạn trong danh sách --</option>
                            <template x-for="p in gameState.players" :key="p.id">
                                <option :value="p.id" x-text="p.name"></option>
                            </template>
                        </select>
                    </div>

                    <button @click="revealCard()" 
                            :disabled="!selectedPlayerId"
                            :class="selectedPlayerId ? 'bg-red-600 hover:bg-red-500 text-white shadow-lg shadow-red-900/30' : 'bg-slate-800 text-slate-500 cursor-not-allowed'"
                            class="w-full py-3.5 rounded-xl font-bold transition flex items-center justify-center space-x-2">
                        <span>👁️ Bóc Thẻ Bài Bí Mật</span>
                    </button>
                </div>

                <!-- Secret Card Modal / View -->
                <div x-show="activePlayer" class="card-flip w-full h-[400px]">
                    <div class="card-inner w-full h-full relative rounded-2xl border-2 shadow-2xl transition-all"
                         :class="isFlipped ? 'card-flipped border-red-600 bg-slate-900' : 'border-slate-800 bg-slate-950 cursor-pointer'"
                         @click="if(!isFlipped) isFlipped = true">
                        
                        <!-- Front Face (Hidden state) -->
                        <div class="card-front absolute inset-0 flex flex-col items-center justify-center p-6 text-center space-y-4">
                            <div class="w-20 h-20 rounded-full bg-red-950/50 border border-red-800/40 flex items-center justify-center text-3xl">
                                🔒
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-white" x-text="activePlayer?.name"></h3>
                                <p class="text-xs text-slate-400 mt-1">Chạm vào đây để lật xem vai trò của bạn</p>
                            </div>
                            <span class="text-[10px] text-amber-500/80 bg-amber-950/40 px-3 py-1 rounded-full border border-amber-800/30">⚠️ Đảm bảo không ai nhìn lén màn hình</span>
                        </div>

                        <!-- Back Face (Role Revealed) -->
                        <div class="card-back absolute inset-0 p-6 flex flex-col justify-between bg-gradient-to-b from-slate-900 via-slate-900 to-red-950/40 rounded-2xl border border-red-900/50 overflow-y-auto">
                            <div class="space-y-3">
                                <div class="flex justify-between items-start">
                                    <span class="text-xs font-bold uppercase tracking-widest px-2.5 py-1 rounded-md"
                                          :class="getFactionBadge(getRoleDetails(activePlayer?.roleId)?.faction)">
                                        <span x-text="getRoleDetails(activePlayer?.roleId)?.faction"></span>
                                    </span>
                                    <button @click.stop="isFlipped = false" class="text-xs text-slate-400 hover:text-white bg-slate-800/60 px-2 py-1 rounded">🙈 An toàn (Che lại)</button>
                                </div>

                                <div class="text-center py-2 space-y-1">
                                    <div class="text-5xl my-1" x-text="getRoleDetails(activePlayer?.roleId)?.icon"></div>
                                    <h2 class="text-2xl font-heading font-black text-white" x-text="getRoleDetails(activePlayer?.roleId)?.name"></h2>
                                </div>

                                <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 leading-relaxed">
                                    <p class="font-semibold text-red-400 mb-1">Kỹ năng / Mạng:</p>
                                    <p x-text="getRoleDetails(activePlayer?.roleId)?.desc"></p>
                                </div>

                                <!-- Werewolf Team Info -->
                                <template x-if="getRoleDetails(activePlayer?.roleId)?.faction === 'Phe Sói'">
                                    <div class="bg-red-950/50 border border-red-800/60 rounded-xl p-3 text-xs text-red-200 space-y-1">
                                        <p class="font-bold text-red-400">🐺 Đồng minh Sói trong ván:</p>
                                        <div class="flex flex-wrap gap-1 mt-1">
                                            <template x-for="wolf in getWerewolfTeammates()" :key="wolf">
                                                <span class="bg-red-900/60 px-2 py-0.5 rounded text-[11px] font-medium" x-text="wolf"></span>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <p class="text-[10px] text-center text-slate-500 mt-2">Chụp màn hình hoặc nhớ kỹ vai trò của bạn!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: ROLE CODEX / WIKI -->
        <div x-show="currentTab === 'wiki'" x-cloak class="space-y-6">
            <div class="text-center space-y-1 py-2">
                <h2 class="text-2xl font-heading font-extrabold text-white">THƯ VIỆN CHARACTER</h2>
                <p class="text-xs text-slate-400">Tra cứu kỹ năng và thông tin luật của các vai trò</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="role in allRoles" :key="role.id">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2 hover:border-slate-700 transition">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="text-2xl" x-text="role.icon"></span>
                                <h3 class="font-bold text-white text-base" x-text="role.name"></h3>
                            </div>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded" :class="getFactionBadge(role.faction)" x-text="role.faction"></span>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed bg-slate-950/50 p-2.5 rounded-lg border border-slate-800/60" x-text="role.desc"></p>
                    </div>
                </template>
            </div>
        </div>

        <!-- TAB 3: GAME MASTER DASHBOARD -->
        <div x-show="currentTab === 'gm'" x-cloak class="space-y-6">
            <div class="bg-slate-900 border border-amber-900/40 rounded-2xl p-5 space-y-4">
                <div class="flex flex-wrap justify-between items-center gap-3">
                    <div>
                        <h2 class="text-xl font-heading font-black text-amber-400 flex items-center space-x-2">
                            <span>👑 BẢNG QUẢN TRÒ</span>
                        </h2>
                        <p class="text-xs text-slate-400">Quản lý vai trò & trạng thái ván đấu Insta Group</p>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <button @click="copyGameLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-2 rounded-xl text-xs transition flex items-center space-x-1.5 shadow">
                            <span>🔗 Copy Link Cho Group Chat</span>
                        </button>
                        <button @click="currentTab = 'setup'" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-2 rounded-xl text-xs transition flex items-center space-x-1">
                            <span>⚙️ Tạo Ván / Sửa Char</span>
                        </button>
                        <button @click="gmAuthenticated = false; currentTab = 'player'" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs transition">
                            🔒 Khóa
                        </button>
                    </div>
                </div>
            </div>

            <!-- Players Secret Table -->
            <div x-show="gameState.players.length" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="font-bold text-white text-sm flex items-center space-x-2">
                        <span>👥 Danh Sách Người Chơi Trong Ván ( <span x-text="gameState.players.length"></span> )</span>
                    </h3>
                    <div class="text-xs text-slate-400">
                        Sống: <span class="text-emerald-400 font-bold" x-text="gameState.players.filter(p => p.alive).length"></span> | 
                        Chết: <span class="text-red-400 font-bold" x-text="gameState.players.filter(p => !p.alive).length"></span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    <template x-for="p in gameState.players" :key="p.id">
                        <div class="bg-slate-950 border rounded-xl p-3 flex flex-col justify-between space-y-2"
                             :class="p.alive ? 'border-slate-800' : 'border-red-950 opacity-60 bg-red-950/10'">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="font-bold text-white text-base" x-text="p.name"></h4>
                                    <div class="flex items-center space-x-1.5 mt-0.5">
                                        <span x-text="getRoleDetails(p.roleId)?.icon"></span>
                                        <span class="text-xs font-semibold text-amber-300" x-text="getRoleDetails(p.roleId)?.name"></span>
                                    </div>
                                </div>
                                <button @click="p.alive = !p.alive; saveState()" 
                                        :class="p.alive ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : 'bg-red-950 text-red-400 border-red-800'"
                                        class="px-2.5 py-1 rounded-lg text-xs font-bold border transition">
                                    <span x-text="p.alive ? 'Sống' : 'Chết'"></span>
                                </button>
                            </div>

                            <input type="text" x-model="p.note" @change="saveState()" placeholder="Ghi chú (bị soi, bảo vệ...)" 
                                   class="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-[11px] text-slate-300 focus:outline-none focus:border-amber-600">
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- TAB 4: SETUP GAME & CUSTOM CHARACTERS -->
        <div x-show="currentTab === 'setup'" x-cloak class="space-y-6">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div>
                    <h2 class="text-xl font-heading font-black text-amber-400">THIẾT LẬP VÁN ĐẤU & CHAR</h2>
                    <p class="text-xs text-slate-400">Cấu hình danh sách người chơi & Tùy chỉnh các tướng</p>
                </div>
                <button @click="currentTab = 'gm'" class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs hover:bg-slate-700">
                     Quay lại Bảng Quản Trò
                </button>
            </div>

            <!-- Player Name Input -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <h3 class="font-bold text-white text-sm">1. Danh sách tên người chơi (Copy từ Group Chat Instagram)</h3>
                <p class="text-xs text-slate-400">Nhập danh sách tên người chơi, mỗi người 1 dòng hoặc cách nhau bằng dấu phẩy:</p>
                <textarea x-model="rawPlayerNames" rows="3" placeholder="An&#10;Bình&#10;Cường&#10;Dung" 
                          class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500"></textarea>
            </div>

            <!-- Role Selection & Count -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-white text-sm">2. Chọn số lượng từng Char cho ván đấu</h3>
                    <button @click="showAddCharModal = true" class="text-xs text-amber-400 hover:text-amber-300 font-bold bg-amber-950/60 border border-amber-800/60 px-2.5 py-1 rounded-lg">
                        ➕ Tạo Char Mới
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <template x-for="role in allRoles" :key="role.id">
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
                            <div class="flex items-center space-x-2">
                                <span class="text-xl" x-text="role.icon"></span>
                                <div>
                                    <p class="text-xs font-bold text-white" x-text="role.name"></p>
                                    <span class="text-[10px] text-slate-400" x-text="role.faction"></span>
                                </div>
                            </div>

                            <div class="flex items-center space-x-2">
                                <button @click="role.count = Math.max(0, (role.count || 0) - 1)" class="w-7 h-7 bg-slate-800 rounded-lg font-bold text-white flex items-center justify-center text-xs hover:bg-slate-700">-</button>
                                <span class="w-6 text-center text-xs font-bold text-amber-400" x-text="role.count || 0"></span>
                                <button @click="role.count = (role.count || 0) + 1" class="w-7 h-7 bg-slate-800 rounded-lg font-bold text-white flex items-center justify-center text-xs hover:bg-slate-700">+</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Action Button -->
            <button @click="generateAndDistributeRoles()" class="w-full bg-gradient-to-r from-amber-600 to-red-600 hover:from-amber-500 hover:to-red-500 text-white font-heading font-black py-4 rounded-2xl shadow-xl transition text-base">
                🎲 CHIA BÀI NGẪU NHIÊN & TẠO VÁN
            </button>
        </div>

    </main>

    <!-- Modal Password Verification for GM -->
    <div x-show="showGmAuthModal" x-cloak class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-amber-900/60 rounded-2xl p-6 max-w-sm w-full space-y-4">
            <h3 class="text-lg font-bold text-amber-400 text-center">🔑 NHẬP MÃ PIN QUẢN TRÒ</h3>
            <p class="text-xs text-slate-400 text-center">Xác minh mã PIN để vào Bảng Quản Trò (God Mode)</p>
            
            <input type="password" x-model="inputPin" @keyup.enter="verifyGmPin()" placeholder="Nhập mã PIN..." 
                   class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-white font-bold tracking-widest focus:outline-none focus:border-amber-500">

            <div class="flex space-x-2">
                <button @click="showGmAuthModal = false" class="w-1/2 py-2.5 rounded-xl bg-slate-800 text-slate-400 text-xs font-bold">Hủy</button>
                <button @click="verifyGmPin()" class="w-1/2 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold">Mở Khóa</button>
            </div>
        </div>
    </div>

    <!-- Modal Add Custom Char -->
    <div x-show="showAddCharModal" x-cloak class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-4">
            <h3 class="text-lg font-bold text-white">➕ TẠO CHARACTER MỚI</h3>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Tên Tướng / Role:</label>
                    <input type="text" x-model="newChar.name" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Icon Emoji:</label>
                    <input type="text" x-model="newChar.icon" placeholder="🐺, 🧙‍♂️, 🛡️..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Phe phái:</label>
                    <select x-model="newChar.faction" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white">
                        <option value="Phe Dân">Phe Dân</option>
                        <option value="Phe Sói">Phe Sói</option>
                        <option value="Phe Thứ 3">Phe Thứ 3 / Đơn Độc</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Mô tả kỹ năng / Luật:</label>
                    <textarea x-model="newChar.desc" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white"></textarea>
                </div>
            </div>

            <div class="flex space-x-2 pt-2">
                <button @click="showAddCharModal = false" class="w-1/2 py-2.5 rounded-xl bg-slate-800 text-slate-400 text-xs font-bold">Hủy</button>
                <button @click="addNewCharacter()" class="w-1/2 py-2.5 rounded-xl bg-amber-600 text-white text-xs font-bold">Lưu Tướng Mới</button>
            </div>
        </div>
    </div>

    <!-- Modal Link Backup (If Auto-Copy fails) -->
    <div x-show="showLinkModal" x-cloak class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-indigo-900/60 rounded-2xl p-6 max-w-md w-full space-y-4">
            <h3 class="text-lg font-bold text-indigo-400 text-center">🔗 LINK VÁN ĐẤU CỦA BẠN</h3>
            <p class="text-xs text-slate-300 text-center">Copy link này và dán vào Group Chat Instagram để mọi người bóc bài:</p>
            
            <textarea x-ref="linkInput" x-model="generatedLink" readonly rows="4" 
                      class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-indigo-300 font-mono break-all focus:outline-none"></textarea>

            <div class="flex space-x-2">
                <button @click="showLinkModal = false" class="w-1/3 py-2.5 rounded-xl bg-slate-800 text-slate-400 text-xs font-bold">Đóng</button>
                <button @click="manualCopyLink()" class="w-2/3 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center justify-center space-x-1">
                    <span>📋 Sao chép link</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 py-6 border-t border-slate-800/80">
        By Rey
    </footer>

    <script>
        function werewolfApp() {
            return {
                currentTab: 'player',
                selectedPlayerId: '',
                activePlayer: null,
                isFlipped: false,
                gmAuthenticated: false,
                showGmAuthModal: false,
                showAddCharModal: false,
                showLinkModal: false,
                generatedLink: '',
                inputPin: '',
                gmPin: '1234',

                rawPlayerNames: '',

                newChar: { name: '', icon: '🃏', faction: 'Phe Dân', desc: '' },

                allRoles: [
                    { id: 'wolf', name: 'Ma Sói', icon: '🐺', faction: 'Phe Sói', count: 2, desc: 'Đêm thức giấc cùng đồng minh Sói để cắn chết 1 dân làng.' },
                    { id: 'seer', name: 'Tiên Tri', icon: '👁️', faction: 'Phe Dân', count: 1, desc: 'Mỗi đêm được chọn 1 người để soi xem là Sói hay Dân.' },
                    { id: 'guard', name: 'Bảo Vệ', icon: '🛡️', faction: 'Phe Dân', count: 1, desc: 'Mỗi đêm chọn 1 người để bảo vệ khỏi Sói cắn (Không bảo vệ 1 người 2 đêm liên tiếp).' },
                    { id: 'witch', name: 'Phù Thủy', icon: '🧪', faction: 'Phe Dân', count: 1, desc: 'Có 1 bình cứu người và 1 bình độc sát hại 1 người trong ván.' },
                    { id: 'hunter', name: 'Thợ Săn', icon: '🏹', faction: 'Phe Dân', count: 1, desc: 'Khi chết được quyền kéo 1 người chơi khác chết chung.' },
                    { id: 'cupid', name: 'Cupid', icon: '💘', faction: 'Phe 3', count: 0, desc: 'Đêm đầu chọn 2 người làm cặp đôi uyên ương ghép mệnh sống chết có nhau.' },
                    { id: 'villager', name: 'Dân Làng', icon: '🧑', faction: 'Phe Dân', count: 3, desc: 'Không có kỹ năng ban đêm, tham gia thảo luận treo cổ ban ngày.' }
                ],

                gameState: {
                    players: []
                },

                initApp() {
                    // Read URL parameters for state
                    const urlParams = new URLSearchParams(window.location.search);
                    const stateData = urlParams.get('state');
                    if (stateData) {
                        try {
                            const decoded = JSON.parse(decodeURIComponent(escape(atob(stateData))));
                            this.gameState = decoded;
                        } catch (e) {
                            console.error('Invalid URL State');
                        }
                    } else {
                        // Load local storage if available
                        const local = localStorage.getItem('werewolf_game_state');
                        if (local) {
                            this.gameState = JSON.parse(local);
                        }
                    }
                },

                revealCard() {
                    const p = this.gameState.players.find(x => x.id == this.selectedPlayerId);
                    if (p) {
                        this.activePlayer = p;
                        this.isFlipped = false;
                    }
                },

                getRoleDetails(roleId) {
                    return this.allRoles.find(r => r.id === roleId) || { name: 'Chưa rõ', icon: '❓', faction: 'Không rõ', desc: '' };
                },

                getWerewolfTeammates() {
                    if (!this.gameState.players.length) return [];
                    const wolfRoleIds = this.allRoles.filter(r => r.faction === 'Phe Sói').map(r => r.id);
                    return this.gameState.players
                        .filter(p => wolfRoleIds.includes(p.roleId))
                        .map(p => p.name);
                },

                getFactionBadge(faction) {
                    if (faction === 'Phe Sói') return 'bg-red-950 text-red-400 border border-red-800';
                    if (faction === 'Phe Dân') return 'bg-emerald-950 text-emerald-400 border border-emerald-800';
                    return 'bg-amber-950 text-amber-400 border border-amber-800';
                },

                openGmTab() {
                    if (this.gmAuthenticated) {
                        this.currentTab = 'gm';
                    } else {
                        this.showGmAuthModal = true;
                    }
                },

                verifyGmPin() {
                    if (this.inputPin === this.gmPin) {
                        this.gmAuthenticated = true;
                        this.showGmAuthModal = false;
                        this.inputPin = '';
                        this.currentTab = 'gm';
                    } else {
                        alert('Mã PIN không chính xác!');
                    }
                },

                addNewCharacter() {
                    if (!this.newChar.name) return;
                    const id = 'custom_' + Date.now();
                    this.allRoles.push({
                        id: id,
                        name: this.newChar.name,
                        icon: this.newChar.icon || '🃏',
                        faction: this.newChar.faction,
                        count: 1,
                        desc: this.newChar.desc || 'Không có mô tả'
                    });
                    this.newChar = { name: '', icon: '🃏', faction: 'Phe Dân', desc: '' };
                    this.showAddCharModal = false;
                },

                generateAndDistributeRoles() {
                    const names = this.rawPlayerNames
                        .split(/[\n,]+/)
                        .map(n => n.trim())
                        .filter(n => n.length > 0);

                    if (!names.length) {
                        alert('Vui lòng nhập ít nhất 1 tên người chơi!');
                        return;
                    }

                    // Build role pool
                    let pool = [];
                    this.allRoles.forEach(r => {
                        for (let i = 0; i < (r.count || 0); i++) {
                            pool.push(r.id);
                        }
                    });

                    if (pool.length < names.length) {
                        alert(`Số lượng Char (${pool.length}) ít hơn số người chơi (${names.length}). Vui lòng thêm Char!`);
                        return;
                    }

                    // Shuffle pool
                    pool = pool.sort(() => Math.random() - 0.5);

                    // Assign
                    this.gameState.players = names.map((name, index) => ({
                        id: 'p_' + (index + 1),
                        name: name,
                        roleId: pool[index],
                        alive: true,
                        note: ''
                    }));

                    this.saveState();
                    this.currentTab = 'gm';
                    alert('Đã chia bài ngẫu nhiên thành công!');
                },

                saveState() {
                    localStorage.setItem('werewolf_game_state', JSON.stringify(this.gameState));
                },

                copyGameLink() {
                    try {
                        const jsonStr = JSON.stringify(this.gameState);
                        const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
                        const baseUrl = window.location.origin + window.location.pathname;
                        const fullUrl = baseUrl + '?state=' + encoded;

                        this.generatedLink = fullUrl;

                        // Try standard clipboard API first
                        if (navigator.clipboard && window.isSecureContext) {
                            navigator.clipboard.writeText(fullUrl).then(() => {
                                alert('📋 Đã copy link ván đấu! Bạn có thể dán (paste) trực tiếp vào Group Chat Instagram.');
                            }).catch(() => {
                                this.showLinkModal = true;
                            });
                        } else {
                            // Fallback to modal
                            this.showLinkModal = true;
                        }
                    } catch (e) {
                        alert('Đã tạo link ván đấu!');
                        this.showLinkModal = true;
                    }
                },

                manualCopyLink() {
                    if (this.$refs.linkInput) {
                        this.$refs.linkInput.select();
                        document.execCommand('copy');
                        alert('📋 Đã sao chép link!');
                        this.showLinkModal = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
